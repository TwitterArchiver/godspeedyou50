  这个其实很简单，化学合成的dmt衍生物其实也蛮多的，比较常见的是用512电烙铁吸入式的dmt烟油。
  <br/>
  在od圈的话，dmt相当于象征着一个危险时代的开始，大家认为是传奇药师的spring春风不就是死于含有dmt到死藤水吗
  <br/>
  熬汤就行了，但别去拼多多买，南方路边的也有很多撒了超标农药的相思树也不行，我身边这几个玩相思汤的好朋友一般会找一个专门种植相思树做家具的大哥买树皮。
  <br/>
  这玩意熬起来挺讲究手法的，广为流传的教程来程序也不太对，我不建议，且dmt门槛有点太高，死倒不会，岔道倒是挺可怕的。
